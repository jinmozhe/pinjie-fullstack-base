# 生产部署使用。
# 应用容器只绑定本机环回地址，由 1Panel OpenResty 提供反向代理。
# 启动命令：docker compose -f compose.prod.yml up -d
services:
  backend:
    image: ghcr.io/${GITHUB_ORG}/pinjie-fullstack-backend:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  web:
    image: ghcr.io/${GITHUB_ORG}/pinjie-fullstack-web:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  admin:
    image: ghcr.io/${GITHUB_ORG}/pinjie-fullstack-admin:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
