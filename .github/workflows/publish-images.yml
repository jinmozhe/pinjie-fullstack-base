name: Publish Images

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-images-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable input
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.input.outputs.commit_sha }}
    steps:
      - name: Validate commit SHA
        id: input
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase 40-character SHA."
            exit 1
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Require workflow from default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"

      - name: Checkout requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.input.outputs.commit_sha }}

      - name: Require commit from default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ steps.input.outputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_SHA" "origin/$DEFAULT_BRANCH"

      - name: Require successful source workflows
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.input.outputs.commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for workflow in ci-governance.yml ci-backend.yml ci-frontend.yml security.yml; do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$EXPECTED_SHA&event=push&status=completed&per_page=100")"
            if ! jq -e 'any(.workflow_runs[]; .conclusion == "success")' <<< "$response" >/dev/null; then
              echo "No successful push run of $workflow exists for $EXPECTED_SHA."
              exit 1
            fi
          done

      - name: Require successful full validation evidence
        id: full-validation
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ steps.input.outputs.commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifact_name="full-validation-$EXPECTED_SHA"
          response="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100")"
          mapfile -t candidates < <(jq -r \
            '.artifacts[] | select(.expired == false and .workflow_run.id != null) | [.id, .workflow_run.id] | @tsv' \
            <<< "$response")
          if [[ "${#candidates[@]}" -eq 0 ]]; then
            echo "No unexpired full validation artifact exists for $EXPECTED_SHA."
            exit 1
          fi

          evidence_root="$(mktemp -d)"
          for candidate in "${candidates[@]}"; do
            IFS=$'\t' read -r artifact_id run_id <<< "$candidate"
            run_response="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            if ! jq -e \
              --arg default_branch "$DEFAULT_BRANCH" \
              '.event == "workflow_dispatch" and .conclusion == "success" and .head_branch == $default_branch and .path == ".github/workflows/ci-e2e.yml"' \
              <<< "$run_response" >/dev/null; then
              continue
            fi

            candidate_dir="$evidence_root/$artifact_id"
            mkdir -p "$candidate_dir"
            curl --fail-with-body --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$candidate_dir/evidence.zip"
            unzip -q "$candidate_dir/evidence.zip" -d "$candidate_dir/content"
            evidence="$candidate_dir/content/full-validation.env"
            if [[ ! -f "$evidence" ]]; then
              continue
            fi

            if pwsh -NoLogo -NoProfile -File ./scripts/ci/check-full-validation-evidence.ps1 \
              -ManifestPath "$evidence" \
              -ExpectedCommitSha "$EXPECTED_SHA" \
              -ExpectedRunId "$run_id"; then
              echo "validation_run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Full validation run: $run_id" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done

          echo "No trustworthy full validation evidence matches $EXPECTED_SHA."
          exit 1

      - name: Require complete application state
        id: state
        shell: pwsh
        run: ./scripts/ci/check-workspace-state.ps1 -GitHubOutputPath $env:GITHUB_OUTPUT

      - name: Reject non-ready applications
        shell: bash
        env:
          ADMIN_STATE: ${{ steps.state.outputs.admin }}
          BACKEND_STATE: ${{ steps.state.outputs.backend }}
          WEB_STATE: ${{ steps.state.outputs.web }}
        run: |
          for state in "$BACKEND_STATE" "$WEB_STATE" "$ADMIN_STATE"; do
            test "$state" = "ready"
          done

      - name: Validate module boundaries
        shell: pwsh
        run: ./scripts/ci/check-module-boundaries.ps1

  publish:
    name: Publish ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    environment: image-publishing
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            dockerfile: apps/backend/Dockerfile
            image: pinjie-fullstack-backend
          - name: web
            dockerfile: apps/web/Dockerfile
            image: pinjie-fullstack-web
          - name: admin
            dockerfile: apps/admin/Dockerfile
            image: pinjie-fullstack-admin
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Verify checked out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Require Dockerfile
        shell: bash
        run: test -f "${{ matrix.dockerfile }}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Validate TCR publishing configuration
        shell: bash
        env:
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          TCR_PASSWORD: ${{ secrets.TCR_PUBLISH_PASSWORD }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_USERNAME: ${{ secrets.TCR_PUBLISH_USERNAME }}
        run: |
          set -euo pipefail
          test "$TCR_REGISTRY" = "ccr.ccs.tencentyun.com"
          test "$TCR_NAMESPACE" = "pinjie-fullstack-base"
          test -n "$TCR_USERNAME"
          test -n "$TCR_PASSWORD"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to TCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_PUBLISH_USERNAME }}
          password: ${{ secrets.TCR_PUBLISH_PASSWORD }}

      - name: Build and push content-addressed candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          outputs: >-
            type=image,"name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}/${{ matrix.image }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Verify dual-registry candidate digest
        shell: bash
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          TCR_IMAGE: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          for image in "$GHCR_IMAGE" "$TCR_IMAGE"; do
            actual="$(docker buildx imagetools inspect "$image@$IMAGE_DIGEST" | awk '$1 == "Digest:" { print $2; exit }')"
            if [[ "$actual" != "$IMAGE_DIGEST" ]]; then
              echo "Candidate digest mismatch for $image: expected $IMAGE_DIGEST, got ${actual:-missing}."
              exit 1
            fi
          done

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write verified digest evidence
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_KEY: ${{ matrix.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified-digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/verified-digests/$IMAGE_KEY.txt"

      - name: Upload verified digest evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/verified-digests/${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Publish verified immutable tags
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    environment: image-publishing
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified digest evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verified-digest-*
          path: verified-digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Validate TCR publishing configuration
        shell: bash
        env:
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          TCR_PASSWORD: ${{ secrets.TCR_PUBLISH_PASSWORD }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
          TCR_USERNAME: ${{ secrets.TCR_PUBLISH_USERNAME }}
        run: |
          set -euo pipefail
          test "$TCR_REGISTRY" = "ccr.ccs.tencentyun.com"
          test "$TCR_NAMESPACE" = "pinjie-fullstack-base"
          test -n "$TCR_USERNAME"
          test -n "$TCR_PASSWORD"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to TCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_PUBLISH_USERNAME }}
          password: ${{ secrets.TCR_PUBLISH_PASSWORD }}

      - name: Validate all tag targets
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
        run: |
          set -euo pipefail
          check_target() {
            local key="$1"
            local image="$2"
            local digest
            local actual
            local target
            digest="$(tr -d '\r\n' < "verified-digests/$key.txt")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            for target in \
              "ghcr.io/$IMAGE_OWNER/$image:sha-$COMMIT_SHA" \
              "$TCR_REGISTRY/$TCR_NAMESPACE/$image:sha-$COMMIT_SHA"; do
              actual="$(docker buildx imagetools inspect "$target" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
              if [[ -n "$actual" && "$actual" != "$digest" ]]; then
                echo "Immutable tag $target already points to $actual, expected $digest."
                exit 1
              fi
            done
          }
          check_target backend pinjie-fullstack-backend
          check_target web pinjie-fullstack-web
          check_target admin pinjie-fullstack-admin

      - name: Publish verified immutable tags
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
        run: |
          set -euo pipefail
          publish_tag() {
            local key="$1"
            local image="$2"
            local digest
            local source
            local target
            local actual
            digest="$(tr -d '\r\n' < "verified-digests/$key.txt")"
            for source in \
              "ghcr.io/$IMAGE_OWNER/$image@$digest" \
              "$TCR_REGISTRY/$TCR_NAMESPACE/$image@$digest"; do
              target="${source%@*}:sha-$COMMIT_SHA"
              actual="$(docker buildx imagetools inspect "$target" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
              if [[ -z "$actual" ]]; then
                docker buildx imagetools create --tag "$target" "$source"
                actual="$(docker buildx imagetools inspect "$target" | awk '$1 == "Digest:" { print $2; exit }')"
              fi
              test "$actual" = "$digest"
              echo "$key=${source%@*}@$digest" >> "$GITHUB_STEP_SUMMARY"
            done
          }
          publish_tag backend pinjie-fullstack-backend
          publish_tag web pinjie-fullstack-web
          publish_tag admin pinjie-fullstack-admin
