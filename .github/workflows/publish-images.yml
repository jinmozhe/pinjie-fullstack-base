name: Publish Images

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-images-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable input
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.input.outputs.commit_sha }}
    steps:
      - name: Validate commit SHA
        id: input
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase 40-character SHA."
            exit 1
          fi
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ steps.input.outputs.commit_sha }}

      - name: Require commit from default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ steps.input.outputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_SHA" "origin/$DEFAULT_BRANCH"

      - name: Require successful source workflows
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.input.outputs.commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for workflow in ci-governance.yml ci-backend.yml ci-frontend.yml security.yml; do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$EXPECTED_SHA&event=push&status=completed&per_page=100")"
            if ! jq -e 'any(.workflow_runs[]; .conclusion == "success")' <<< "$response" >/dev/null; then
              echo "No successful push run of $workflow exists for $EXPECTED_SHA."
              exit 1
            fi
          done

      - name: Require complete application state
        id: state
        shell: pwsh
        run: ./scripts/ci/check-workspace-state.ps1 -GitHubOutputPath $env:GITHUB_OUTPUT

      - name: Reject non-ready applications
        shell: bash
        env:
          ADMIN_STATE: ${{ steps.state.outputs.admin }}
          BACKEND_STATE: ${{ steps.state.outputs.backend }}
          WEB_STATE: ${{ steps.state.outputs.web }}
        run: |
          for state in "$BACKEND_STATE" "$WEB_STATE" "$ADMIN_STATE"; do
            test "$state" = "ready"
          done

      - name: Validate module boundaries
        shell: pwsh
        run: ./scripts/ci/check-module-boundaries.ps1

  publish:
    name: Publish ${{ matrix.name }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            dockerfile: apps/backend/Dockerfile
            image: pinjie-fullstack-backend
          - name: web
            dockerfile: apps/web/Dockerfile
            image: pinjie-fullstack-web
          - name: admin
            dockerfile: apps/admin/Dockerfile
            image: pinjie-fullstack-admin
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Verify checked out commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Require Dockerfile
        shell: bash
        run: test -f "${{ matrix.dockerfile }}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push content-addressed candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write verified digest evidence
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_KEY: ${{ matrix.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified-digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/verified-digests/$IMAGE_KEY.txt"

      - name: Upload verified digest evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/verified-digests/${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Publish verified immutable tags
    needs:
      - validate
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download verified digest evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: verified-digest-*
          path: verified-digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate all tag targets
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          check_target() {
            local key="$1"
            local image="$2"
            local digest
            local actual
            digest="$(tr -d '\r\n' < "verified-digests/$key.txt")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            actual="$(docker buildx imagetools inspect "ghcr.io/$IMAGE_OWNER/$image:sha-$COMMIT_SHA" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
            if [[ -n "$actual" && "$actual" != "$digest" ]]; then
              echo "Immutable tag for $image already points to $actual, expected $digest."
              exit 1
            fi
          }
          check_target backend pinjie-fullstack-backend
          check_target web pinjie-fullstack-web
          check_target admin pinjie-fullstack-admin

      - name: Publish verified immutable tags
        shell: bash
        env:
          COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          publish_tag() {
            local key="$1"
            local image="$2"
            local digest
            local source
            local target
            local actual
            digest="$(tr -d '\r\n' < "verified-digests/$key.txt")"
            source="ghcr.io/$IMAGE_OWNER/$image@$digest"
            target="ghcr.io/$IMAGE_OWNER/$image:sha-$COMMIT_SHA"
            actual="$(docker buildx imagetools inspect "$target" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }' || true)"
            if [[ -z "$actual" ]]; then
              docker buildx imagetools create --tag "$target" "$source"
              actual="$(docker buildx imagetools inspect "$target" | awk '$1 == "Digest:" { print $2; exit }')"
            fi
            test "$actual" = "$digest"
            echo "$key=ghcr.io/$IMAGE_OWNER/$image@$digest" >> "$GITHUB_STEP_SUMMARY"
          }
          publish_tag backend pinjie-fullstack-backend
          publish_tag web pinjie-fullstack-web
          publish_tag admin pinjie-fullstack-admin
