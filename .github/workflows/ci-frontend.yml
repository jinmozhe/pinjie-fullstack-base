name: CI - Frontend

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  frontend-state:
    name: Frontend state and boundaries
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.state.outputs.admin }}
      web: ${{ steps.state.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate workspace state
        id: state
        shell: pwsh
        run: ./scripts/ci/check-workspace-state.ps1 -GitHubOutputPath $env:GITHUB_OUTPUT

      - name: Validate module boundaries
        shell: pwsh
        run: ./scripts/ci/check-module-boundaries.ps1

      - name: Report empty applications
        if: steps.state.outputs.web == 'empty' || steps.state.outputs.admin == 'empty'
        shell: bash
        run: echo "One or more frontend applications are explicit empty skeletons. Their application quality checks have not passed."

  web-quality:
    name: Web quality
    needs: frontend-state
    if: needs.frontend-state.outputs.web == 'ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Web
        run: pnpm --filter @pinjie/web lint

      - name: Typecheck Web
        run: pnpm --filter @pinjie/web typecheck

      - name: Test Web
        run: pnpm --filter @pinjie/web test

      - name: Build Web
        run: pnpm --filter @pinjie/web build

      - name: Reject generated API Client drift
        run: pnpm generate-api && git diff --exit-code -- packages/api-client/src

  admin-quality:
    name: Admin quality
    needs: frontend-state
    if: needs.frontend-state.outputs.admin == 'ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Admin
        run: pnpm --filter @pinjie/admin lint

      - name: Typecheck Admin
        run: pnpm --filter @pinjie/admin typecheck

      - name: Test Admin
        run: pnpm --filter @pinjie/admin test

      - name: Build Admin
        run: pnpm --filter @pinjie/admin build

      - name: Reject generated API Client drift
        run: pnpm generate-api && git diff --exit-code -- packages/api-client/src
