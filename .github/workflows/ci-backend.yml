name: CI - Backend

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend-state:
    name: Backend state and boundaries
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.state.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate workspace state
        id: state
        shell: pwsh
        run: ./scripts/ci/check-workspace-state.ps1 -GitHubOutputPath $env:GITHUB_OUTPUT

      - name: Validate module boundaries
        shell: pwsh
        run: ./scripts/ci/check-module-boundaries.ps1

      - name: Report empty Backend
        if: steps.state.outputs.backend == 'empty'
        shell: bash
        run: echo "Backend is an explicit empty skeleton. Application quality checks have not passed."

  backend-quality:
    name: Backend quality
    needs: backend-state
    if: needs.backend-state.outputs.backend == 'ready'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Sync locked dependencies
        working-directory: apps/backend
        run: uv sync --locked

      - name: Ruff
        working-directory: apps/backend
        run: uv run ruff check .

      - name: Mypy
        working-directory: apps/backend
        run: uv run mypy app

      - name: Validate isolated test database
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        shell: bash
        run: |
          uv run python -c 'import os; from urllib.parse import urlsplit; name=urlsplit(os.environ["DATABASE_URL"]).path.rsplit("/", 1)[-1]; assert name.endswith("_test"), "TEST_DATABASE_URL must target a database ending in _test"'

      - name: Upgrade test database twice
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: uv run alembic upgrade head && uv run alembic upgrade head

      - name: Pytest
        working-directory: apps/backend
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          REDIS_URL: ${{ secrets.TEST_REDIS_URL }}
        run: uv run pytest tests/ -v

      - name: Export OpenAPI contract
        working-directory: apps/backend
        run: uv run python scripts/export_openapi.py --output ../../openapi.json

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate API Client
        run: pnpm generate-api

      - name: Reject generated contract drift
        run: git diff --exit-code -- openapi.json packages/api-client/src

  breaking-contract:
    name: OpenAPI breaking changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"

      - name: Reject breaking OpenAPI changes
        uses: oasdiff/oasdiff-action/breaking@033c15c845bef10f148afb0fa781bf1b2a7fe1bf # v0.1.12
        with:
          base: origin/${{ github.base_ref }}:openapi.json
          revision: HEAD:openapi.json
          fail-on: ERR
          review: false
