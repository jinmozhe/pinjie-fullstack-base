packages:
  - "apps/*"
  - "packages/*"
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
  - "semver@5.7.2"
  - "undici-types@6.21.0"
  # Umi Max 4.7.x currently resolves this transitive Redux adapter without provenance metadata.
  - "react-redux@8.1.3"
  # Umi Max 4.7.x bundler is pinned to Vite 4.5.2.
  - "vite@4.5.2"
  - "rollup@3.30.0"
overrides:
  path-to-regexp: 8.4.2
  qiankun: 2.10.16
  "js-yaml@<5": 4.3.1
  immer: 9.0.6
  "node-fetch@<2.6.7": 2.6.7
  "axios@<0.31.2": 1.19.0
  "image-size@<2.0.3": 2.0.3
  "vite@<6.4.3": 6.4.3
  "@babel/core@<=7.29.0": 7.29.7
  "@babel/runtime@<7.26.10": 7.29.7
  "esbuild@<=0.24.2": 0.25.12
  "send@<0.19.0": 0.19.2
allowBuilds:
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  msw: true
  sharp: true
